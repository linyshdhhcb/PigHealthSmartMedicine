# 生产环境配置
server:
  port: 8080

spring:
  # 数据源配置
  datasource:
    url: jdbc:mysql://prod-server-ip:3306/pig_health_smart_medicine?serverTimezone=Hongkong&useAffectedRows=true&characterEncoding=utf-8
    username: prod_username               #生产环境数据库用户名
    password: prod_password               #生产环境数据库密码
  
  # 邮件配置
  mail:
    username: prod_qq_email               # 生产环境qq邮箱
    password: prod_qq_email_password      # 生产环境qq邮箱授权码
  
  # Redis配置
  data:
    redis:
      host: prod-server-ip
      port: 6379
      password: prod_redis_password
  
  # MinIO配置
  minio:
    access-key: prod_minio_access_key
    secret-key: prod_minio_secret_key
    url: https://minio.yourdomain.com

  # Milvus向量数据库配置
  ai:
    vectorstore:
      milvus:
        client:
          host: prod-server-ip
          port: 19530

# AI配置
ai:
  selection:
    chat-provider: bailian
    embedding-provider: siliconflow
  chat:
    default-model: qwen-plus-latest
  embedding:
    default-model: Qwen/Qwen3-Embedding-8B
  chunk:
    chunk-size: 800
    chunk-overlap: 200
    min-chunk-size-chars: 350
    min-chunk-length-to-embed: 5
    max-num-chunks: 10000
    keep-separator: true
  providers:
    ollama:
      url: http://prod-server-ip:11434
      endpoints:
        chat: /v1/chat/completions
        embedding: /api/embeddings
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: prod_bailian_api_key
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        embedding: /compatible-mode/v1/embeddings
    siliconflow:
      url: https://api.siliconflow.cn
      api-key: prod_siliconflow_api_key
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
  ollama:
    url: http://prod-server-ip:11434

# 日志配置（生产环境只记录warn和error）
logging:
  level:
    com.linyi.pig: warn
    world.world.xuewei.dao.mapper: warn
  file:
    name: /var/log/pig-health/application.log
    max-size: 100MB
    max-history: 30

# Knife4j配置（生产环境禁用）
knife4j:
  enable: false
